name: Refresh calendar snapshot

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay or skip scheduled runs on quiet repos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download public ICS from Google Calendar
        run: |
          set -euo pipefail
          URL="https://calendar.google.com/calendar/ical/149ccba232b830c7557629b747f383272b6576bc8ef69c284663f897ad860b2d%40group.calendar.google.com/public/basic.ics"
          curl -fsSL --retry 3 --retry-delay 5 -m 60 "$URL" -o /tmp/new.ics
          grep -q "BEGIN:VCALENDAR" /tmp/new.ics
          grep -q "END:VCALENDAR" /tmp/new.ics

      - name: Commit only on a real calendar change
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Canonical comparison: unfolded, DTSTAMP dropped, VEVENTs sorted by UID/RECURRENCE-ID
          RESULT=$(python3 scripts/update_snapshot.py /tmp/new.ics)
          echo "Result: $RESULT"
          if [ "$RESULT" = "changed" ]; then
            git add data/events.ics data/meta.json
            git commit -m "Calendar changed: $(python3 -c 'import json;m=json.load(open("data/meta.json"));print(m["events"],"events, edited",m["updatedAt"])')"
          else
            # Keep the schedule alive (GitHub disables schedules after 60 days without activity).
            # Heartbeat goes to a file the page never reads.
            LAST=$(git log -1 --format=%ct -- .github/heartbeat.txt 2>/dev/null || true)
            if [ $(( $(date +%s) - ${LAST:-0} )) -gt $(( 25 * 86400 )) ]; then
              date -u +%Y-%m-%dT%H:%M:%SZ > .github/heartbeat.txt
              git add .github/heartbeat.txt
              git commit -m "Heartbeat (calendar unchanged)"
            else
              echo "No real change — nothing committed."
              exit 0
            fi
          fi
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
