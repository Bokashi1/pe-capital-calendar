name: Push reminders (evening before + morning of)

# Daily digest of TOMORROW's events at ~18:00 Kuwait time. Off unless the repository
# variable PUSH_REMINDERS is set to "on" (Settings > Secrets and variables > Actions > Variables)
# AND the OneSignal secrets exist.
on:
  schedule:
    - cron: "0 17 * * *"   # 20:00 Kuwait: tomorrow's events
    - cron: "0 5 * * *"    # 08:00 Kuwait: today's events
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    if: vars.PUSH_REMINDERS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python3 scripts/push_notify.py remind ${{ github.event.schedule == '0 5 * * *' && '0' || '1' }}
