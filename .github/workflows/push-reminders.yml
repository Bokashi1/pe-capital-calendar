name: Push reminders (day before)

# Daily digest of TOMORROW's events at ~18:00 Kuwait time. Off unless the repository
# variable PUSH_REMINDERS is set to "on" (Settings > Secrets and variables > Actions > Variables)
# AND the OneSignal secrets exist.
on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 18:00 Kuwait
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    if: vars.PUSH_REMINDERS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python3 scripts/push_notify.py remind 1
